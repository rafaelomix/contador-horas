<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contador de horas</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6bff">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mut:#6b7488;--ac:#2f6bff;--ok:#12805c;--bad:#c2410c;--bd:#e1e5ee;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111521;--card:#1a2030;--tx:#e8ecf6;--mut:#98a2b8;--ac:#6c95ff;--ok:#3ecf9a;--bad:#ff9a62;--bd:#2b3347;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111521;--card:#1a2030;--tx:#e8ecf6;--mut:#98a2b8;--ac:#6c95ff;--ok:#3ecf9a;--bad:#ff9a62;--bd:#2b3347;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px;display:flex;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nav b{font-size:17px;text-transform:capitalize}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.g .h{font-size:12px;color:var(--mut);text-align:center}
.d{aspect-ratio:1;border:1px solid var(--bd);border-radius:10px;padding:3px;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:transparent;color:var(--tx)}
.d small{font-size:10px;line-height:1}
.d.sel{outline:2px solid var(--ac)}
.d.hoy{font-weight:700;border-color:var(--ac)}
.d.pos small{color:var(--ok)}.d.neg small{color:var(--bad)}
.r{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
label{font-size:13px;color:var(--mut);display:block}
input,textarea{width:100%;font:inherit;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.res{display:flex;justify-content:space-between;gap:8px;margin:8px 0;font-size:15px}
.big{font-size:22px;font-weight:700}
.pos-t{color:var(--ok)}.neg-t{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{flex:1}
#msg{font-size:13px;color:var(--mut);min-height:18px;margin-top:6px}
.tabs{margin-bottom:12px}.tabs button{padding:10px}
[hidden]{display:none!important}
.ym{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mm{border:1px solid var(--bd);border-radius:12px;padding:8px}
.mm.cur{border-color:var(--ac)}
.mh{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:transparent;padding:2px 2px 6px;font-weight:600;text-transform:capitalize;color:var(--tx)}
.mh small{font-weight:600}
.md{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.md span{font-size:10px;text-align:center;border-radius:4px;padding:3px 0;cursor:pointer}
.md .p{background:rgba(18,128,92,.22)}.md .n{background:rgba(194,65,12,.25)}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;padding:8px 0;border-top:1px solid var(--bd);cursor:pointer}
.li small{color:var(--mut)}
.li .c{grid-column:1/-1;font-size:14px}
</style>
</head>
<body>
<div class="w">
<h1>🕐 Contador de horas</h1>
<div class="row tabs"><button id="bm" class="p">Mes</button><button id="ba">Año</button></div>
<div id="vm">

<div class="card">
  <div class="nav"><button id="prev" aria-label="Mes anterior">‹</button><b id="mes"></b><button id="next" aria-label="Mes siguiente">›</button></div>
  <div class="g" id="cal"></div>
  <div class="res" style="margin-top:12px"><span>Balance del mes</span><span class="big" id="tm"></span></div>
</div>

<div class="card">
  <b id="fd"></b>
  <div class="r"><div><label>Mañana: entrada</label><input type="time" id="m1"></div><div><label>Mañana: salida</label><input type="time" id="m2"></div></div>
  <div class="r"><div><label>Tarde: entrada</label><input type="time" id="t1"></div><div><label>Tarde: salida</label><input type="time" id="t2"></div></div>
  <div class="res"><span>Total trabajado</span><b id="tt"></b></div>
  <div class="res"><span id="el">Horas extra</span><span class="big" id="te"></span></div>
  <label>Comentario del día</label>
  <textarea id="c" rows="3" placeholder="Trabajos realizados…"></textarea>
  <div class="row" style="margin-top:8px"><button id="borrar">Borrar día</button></div>
</div>

</div>
<div id="va" hidden>
  <div class="card">
    <div class="nav"><button id="py" aria-label="Año anterior">‹</button><b id="ay"></b><button id="ny" aria-label="Año siguiente">›</button></div>
    <div class="ym" id="ym"></div>
    <div class="res" style="margin-top:12px"><span>Balance del año</span><span class="big" id="ty"></span></div>
  </div>
  <div class="card"><b>Registros del año</b><div id="lst"></div></div>
</div>
<div class="card">
  <b>Exportar a Excel</b>
  <div class="row" style="margin-top:8px"><button class="p" id="xm">Mes actual</button><button class="p" id="xa">Año completo</button></div>
  <div id="msg"></div>
</div>
</div>

<script>
const JORNADA=480, K="contador-horas-v1", DEF={m1:"08:00",m2:"13:00",t1:"15:00",t2:"18:00",c:""};
let data={}, sel=iso(new Date()), cur=new Date(); cur.setDate(1);
try{data=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){data={}}
const $=id=>document.getElementById(id);
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function save(){try{localStorage.setItem(K,JSON.stringify(data))}catch(e){}}
function mn(s){if(!s)return null;const[a,b]=s.split(":").map(Number);return a*60+b}
function seg(a,b){a=mn(a);b=mn(b);return(a!=null&&b!=null&&b>a)?b-a:0}
function calc(o){if(!o)return null;const t=seg(o.m1,o.m2)+seg(o.t1,o.t2);if(!t&&!o.c)return null;return{t,e:t?t-JORNADA:0,has:!!t}}
function fmt(m,sg){const s=m<0?"−":(sg&&m>0?"+":"");m=Math.abs(m);return s+Math.floor(m/60)+":"+String(m%60).padStart(2,"0")}
function entries(pref){return Object.keys(data).filter(k=>k.startsWith(pref)).sort()}
function render(keep){
  const y=cur.getFullYear(),mo=cur.getMonth();
  $("mes").textContent=cur.toLocaleDateString("es-ES",{month:"long",year:"numeric"});
  const cal=$("cal");cal.innerHTML="";
  "LMXJVSD".split("").forEach(l=>{const h=document.createElement("div");h.className="h";h.textContent=l;cal.appendChild(h)});
  const off=(new Date(y,mo,1).getDay()+6)%7, n=new Date(y,mo+1,0).getDate(), hoy=iso(new Date());
  for(let i=0;i<off;i++)cal.appendChild(document.createElement("div"));
  for(let d=1;d<=n;d++){
    const k=iso(new Date(y,mo,d)),r=calc(data[k]),b=document.createElement("button");
    b.className="d"+(k===sel?" sel":"")+(k===hoy?" hoy":"")+(r&&r.has?(r.e>=0?" pos":" neg"):"");
    b.innerHTML="<span>"+d+"</span><small>"+(r&&r.has?fmt(r.e,1):"&nbsp;")+"</small>";
    b.onclick=()=>{sel=k;render()};cal.appendChild(b);
  }
  let tot=0;entries(y+"-"+String(mo+1).padStart(2,"0")).forEach(k=>{const r=calc(data[k]);if(r&&r.has)tot+=r.e});
  const tm=$("tm");tm.textContent=fmt(tot,1)+" h";tm.className="big "+(tot>=0?"pos-t":"neg-t");
  const [sy,sm,sd]=sel.split("-").map(Number);
  $("fd").textContent=new Date(sy,sm-1,sd).toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
  if(!keep){const o=data[sel]||DEF;["m1","m2","t1","t2"].forEach(f=>$(f).value=o[f]||"");$("c").value=o.c||""}
  upd();
}
function upd(){
  const t=seg($("m1").value,$("m2").value)+seg($("t1").value,$("t2").value), e=t-JORNADA;
  $("tt").textContent=fmt(t)+" h";
  const el=$("te");
  if(!t){el.textContent="—";el.className="big";$("el").textContent="Horas extra";return}
  el.textContent=fmt(e,1)+" h";el.className="big "+(e>=0?"pos-t":"neg-t");
  $("el").textContent=e>=0?"Horas extra":"Horas que faltan";
}
function store(){
  const o={m1:$("m1").value,m2:$("m2").value,t1:$("t1").value,t2:$("t2").value,c:$("c").value.trim()};
  if(Object.values(o).every(v=>!v))delete data[sel];else data[sel]=o;
  save();
}
["m1","m2","t1","t2","c"].forEach(f=>$(f).addEventListener("input",()=>{upd();store();renderLight()}));
function renderLight(){render(true)}
$("borrar").onclick=()=>{delete data[sel];save();render()};
$("prev").onclick=()=>{cur.setMonth(cur.getMonth()-1);render()};
$("next").onclick=()=>{cur.setMonth(cur.getMonth()+1);render()};

async function exportar(pref,nombre){
  const msg=$("msg"),ks=entries(pref);
  if(!ks.length){msg.textContent="No hay datos en ese periodo.";return}
  const rows=[["Fecha","Entrada mañana","Salida mañana","Entrada tarde","Salida tarde","Total (h:mm)","Extra (h:mm)","Extra (horas)","Comentario"]];
  let tot=0;
  ks.forEach(k=>{const o=data[k],r=calc(o)||{t:0,e:0,has:false};if(r.has)tot+=r.e;
    rows.push([k.split("-").reverse().join("/"),o.m1||"",o.m2||"",o.t1||"",o.t2||"",r.has?fmt(r.t):"",r.has?fmt(r.e,1):"",r.has?Math.round(r.e/60*100)/100:"",o.c||""])});
  rows.push([]);rows.push(["TOTAL","","","","","",fmt(tot,1),Math.round(tot/60*100)/100,""]);
  try{
    const ws=XLSX.utils.aoa_to_sheet(rows);ws["!cols"]=[{wch:11},{wch:14},{wch:13},{wch:13},{wch:12},{wch:12},{wch:12},{wch:12},{wch:50}];
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Horas");
    const buf=XLSX.write(wb,{type:"array",bookType:"xlsx"});
    const fn="horas-"+nombre+".xlsx";
    let dl=null;try{if(typeof claude!=="undefined")dl=await claude.use("downloads")}catch(e){}
    if(dl){await dl.save({filename:fn,data:buf})}
    else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
    msg.textContent="Archivo guardado.";
  }catch(e){msg.textContent=(e&&e.code==="declined")?"Descarga cancelada.":"No se pudo exportar."}
}
$("xm").onclick=()=>{const y=cur.getFullYear(),m=String(cur.getMonth()+1).padStart(2,"0");exportar(y+"-"+m,y+"-"+m)};
$("xa").onclick=()=>{const y=String(cur.getFullYear());exportar(y,y)};
const MN=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function show(v){$("vm").hidden=v!=="m";$("va").hidden=v!=="a";$("bm").className=v==="m"?"p":"";$("ba").className=v==="a"?"p":"";if(v==="m")render();else renderYear()}
function openDay(k){const[a,b]=k.split("-").map(Number);cur=new Date(a,b-1,1);sel=k;show("m");window.scrollTo(0,0)}
function renderYear(){
  const y=cur.getFullYear(),box=$("ym");box.innerHTML="";$("ay").textContent=y;let ty=0;
  for(let m=0;m<12;m++){
    const pf=y+"-"+String(m+1).padStart(2,"0"),card=document.createElement("div");card.className="mm"+((new Date().getFullYear()===y&&new Date().getMonth()===m)?" cur":"");
    let tot=0;entries(pf).forEach(k=>{const r=calc(data[k]);if(r&&r.has)tot+=r.e});ty+=tot;
    const h=document.createElement("button");h.className="mh";
    h.innerHTML="<span>"+new Date(y,m,1).toLocaleDateString("es-ES",{month:"long"})+"</span><small class='"+(tot>=0?"pos-t":"neg-t")+"'>"+(tot?fmt(tot,1):"")+"</small>";
    h.onclick=()=>{cur=new Date(y,m,1);if(!sel.startsWith(pf))sel=pf+"-01";show("m")};
    card.appendChild(h);
    const g=document.createElement("div");g.className="md";
    const off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
    for(let i=0;i<off;i++)g.appendChild(document.createElement("span"));
    for(let d=1;d<=n;d++){const k=pf+"-"+String(d).padStart(2,"0"),r=calc(data[k]),sp=document.createElement("span");
      sp.textContent=d;if(r&&r.has)sp.className=r.e>=0?"p":"n";sp.onclick=()=>openDay(k);g.appendChild(sp)}
    card.appendChild(g);box.appendChild(card);
  }
  const t=$("ty");t.textContent=fmt(ty,1)+" h";t.className="big "+(ty>=0?"pos-t":"neg-t");
  const L=$("lst");L.innerHTML="";const ks=entries(String(y));
  if(!ks.length){L.innerHTML="<div style='color:var(--mut);margin-top:8px'>Sin registros este año.</div>";return}
  ks.forEach(k=>{const o=data[k],r=calc(o)||{t:0,e:0,has:false},[a,b,c]=k.split("-").map(Number);
    const li=document.createElement("div");li.className="li";
    const f=document.createElement("b");f.textContent=new Date(a,b-1,c).toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short"});
    const mid=document.createElement("small");mid.textContent=[o.m1&&o.m2?o.m1+"–"+o.m2:"",o.t1&&o.t2?o.t1+"–"+o.t2:""].filter(Boolean).join(" · ");
    const ex=document.createElement("b");ex.textContent=r.has?fmt(r.e,1):"";ex.className=r.e>=0?"pos-t":"neg-t";
    li.append(f,mid,ex);
    if(o.c){const cm=document.createElement("div");cm.className="c";cm.textContent=o.c;li.appendChild(cm)}
    li.onclick=()=>openDay(k);L.appendChild(li)});
}
$("bm").onclick=()=>show("m");$("ba").onclick=()=>show("a");
$("py").onclick=()=>{cur.setFullYear(cur.getFullYear()-1);renderYear()};
$("ny").onclick=()=>{cur.setFullYear(cur.getFullYear()+1);renderYear()};
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
